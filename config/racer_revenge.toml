# Interior syscall handlers inside kseg0 overlays. These addresses are
# installed via SetSyscall but not reachable via direct jal, so the T6
# overlay-auto-extras pass doesn't see them. Without these entries each
# handler isn't a standalone recompiled function — the runtime's
# kseg0-fallback dispatcher then treats them as failed lookups.
