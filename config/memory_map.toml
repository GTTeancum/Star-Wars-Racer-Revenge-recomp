[[entries]]
address = "0x0038428C"
width   = 4
name    = "tlb_callback_ptr"
desc    = "TLB callback function pointer. Written by entry_2f7d48 (TLB-related code). Called from multiple jalr sites in the 0x2F7xxx range. Surfaced by indirect-target xref analysis."
tags    = ["kernel"]

[[entries]]
address = "0x0044BC80"
width   = 0x200
name    = "exception_frame_buffer"
desc    = "$k0-based EE exception save-state frame. Populated by ee_exceptionSaveState (0x2FE300), installed as handler for EE exception levels 1/2/3. Also used as $sp for the game frame loop."
tags    = ["kernel", "thread"]

