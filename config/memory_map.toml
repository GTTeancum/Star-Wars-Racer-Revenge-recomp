# Memory map — documented addresses and their meanings.
#
# This file is the canonical table of "what lives at what address" for
# Racer Revenge, sourced from a combination of:
#   - xref database findings (build/xref/globals.json)
#   - manual reverse-engineering (Ghidra decompilations, runtime traces)
#   - PS2 hardware/IO register conventions
#
# Consumed by tools/xref/query.py (adds symbolic names to output) and by
# runtime watchpoint config. Keep entries sorted by address.
#
# Schema per entry:
#   [[entries]]
#   address = "0xXXXXXXXX"    # absolute guest address
#   name    = "..."           # short symbolic name, C-identifier style
#   width   = 4               # bytes (1/2/4/8/0x1000 etc.)
#   desc    = "..."           # one-line description
#   tags    = ["state","gs"]  # free-form tags
#
# A range entry uses `end` instead of `width`:
#   [[entries]]
#   address = "0xXXXXXXXX"
#   end     = "0xYYYYYYYY"
#   name    = "..."
#   desc    = "..."

# ------------------------------------------------------------------------
# Game state machine (EE data segment, 0x380000+)
# ------------------------------------------------------------------------

[[entries]]
address = "0x00384670"
name    = "game_state_fn"
width   = 4
desc    = "Current frame-work function pointer. Read each VBlank by frame dispatch at 0x2FE400; written by setGameState (0x2FDDF8)."
tags    = ["state_machine", "frame"]

[[entries]]
address = "0x00384678"
end     = "0x003846F8"
name    = "syscall_dispatch_table"
desc    = "EE custom kernel syscall handler table. Indexed by (syscall_id & 0x7C) / 4. Read by the EE exception dispatcher at 0x2FE648."
tags    = ["state_machine", "kernel"]

[[entries]]
address = "0x003846B8"
end     = "0x003846E0"
name    = "syscall_install_table"
desc    = "Contiguous handler install list iterated by entry_2fdf48 during boot (reads at 0x2FDFxx). 9 word-sized entries."
tags    = ["kernel", "boot"]

[[entries]]
address = "0x00384988"
width   = 4
desc    = "Some value loaded during entry_2fe750's SetSyscall sequence"
tags    = ["kernel"]

[[entries]]
address = "0x0038499C"
width   = 4
desc    = "Stored by entry_2fe790; part of kernel setup state"
tags    = ["kernel"]

# ------------------------------------------------------------------------
# Module / render state
# ------------------------------------------------------------------------

[[entries]]
address = "0x00383760"
width   = 0x20
name    = "module_struct"
desc    = "Module state struct base. Returned hard-coded by getModuleStructPtr (0x2EB050). Field at +8 (0x383768) controls VBlank wait routing."
tags    = ["module", "render"]

[[entries]]
address = "0x00383768"
width   = 4
name    = "module_struct.vblank_mode"
desc    = "If 0 → vblank_wait (0x2F6030); if non-zero → vblank_waitCancellable (0x2F60C0). Read by vblank_waitGated (0x2EB0C8) each frame."
tags    = ["module", "render"]

[[entries]]
address = "0x0038544C"
width   = 4
name    = "module_table_ptr"
desc    = "Pointer to the module table base (= 0x385160 post-boot). Read by module_renderPrep (0x3075A8) and renderList_manager (0x30B4F0)."
tags    = ["module"]

[[entries]]
address = "0x00385148"
width   = 0x40
name    = "kernel_descriptor_table"
desc    = "Boot descriptor table consumed by kernel_overlay_loader (0x2FE8D0). Each entry is (syscall_id, handler_va) pairs; drives overlay memcpy + SetSyscall sequence."
tags    = ["kernel", "boot"]

[[entries]]
address = "0x00385160"
name    = "module_table"
width   = 4
desc    = "Module table base address. Contains module state block pointer at +0x1D4 (= 0x385334). Module callbacks read/write through here."
tags    = ["module"]

[[entries]]
address = "0x00385168"
width   = 4
name    = "module_sub_ptr"
desc    = "Sub-pointer within the module table region. Written to by module_renderPrep (0x3075A8) at offset +84."
tags    = ["module", "render"]

[[entries]]
address = "0x00385334"
width   = 4
name    = "module_state_block_ptr"
desc    = "Pointer to the 128-byte module state block (32 × 4-byte slots). Each non-zero slot is called by the module status checker (0x308B00) and cleared. Bootstrap pre-allocates this at 0x44E000."
tags    = ["module"]

[[entries]]
address = "0x0036C100"
width   = 4
name    = "gs_subsystem_ready_flag"
desc    = "Read by gs_dispatchHelper (0x133660). If 0: return immediately (GS not ready). If non-zero + $a0=0: call module_renderPrep + vblank_waitGated. Written to 1 by the game after IOP module init completes."
tags    = ["gs_state", "module"]

[[entries]]
address = "0x003D6324"
width   = 1
name    = "gs_init_once_flag"
desc    = "At gp-0x764C. Set to 1 by gs_initState (0x251B10) on its first call; checked to prevent re-running GS hardware init. Zero-initialized (BSS)."
tags    = ["gs_state"]

# ------------------------------------------------------------------------
# GS subsystem
# ------------------------------------------------------------------------

[[entries]]
address = "0x00442B70"
name    = "gs_init_flag"
width   = 4
desc    = "Set to 1 by entry_251a20 on first GS init. Checked by the GS init function to short-circuit re-entry."
tags    = ["gs_state"]

[[entries]]
address = "0x00443870"
name    = "gs_state_ptr"
width   = 4
desc    = "Pointer to the GS state structure (framebuffer descriptors, display buffer array, mode). Allocated by entry_13fda0_0x140230. 66 readers across the GS code."
tags    = ["gs_state"]

