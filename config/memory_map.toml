# ------------------------------------------------------------------------

[[entries]]
address = "0x003D6B20"
name    = "hot_state_a"
width   = 4
desc    = "Top write hotspot (320 writers across 24 functions). Purpose TBD — likely a main state/flags struct field. Worth a watchpoint."
tags    = ["hot_state", "unclassified"]

[[entries]]
address = "0x003D6B30"
name    = "hot_state_b"
width   = 4
desc    = "Adjacent to hot_state_a (152 writers)."
tags    = ["hot_state", "unclassified"]

[[entries]]
address = "0x003D6B38"
name    = "hot_state_c"
width   = 4
desc    = "Adjacent to hot_state_a (76 writers)."
tags    = ["hot_state", "unclassified"]

[[entries]]
address = "0x00435368"
width   = 4
desc    = "GS-adjacent state, 51 writers. Likely part of the GS command-buffer/descriptor system (written by the GS allocator)."
tags    = ["gs_state", "hot_state"]

[[entries]]
address = "0x00435370"
width   = 8
desc    = "Companion to 0x435368 (100 writers). 8-byte stores suggest a 64-bit pointer or timestamp."
tags    = ["gs_state", "hot_state"]

# ------------------------------------------------------------------------
# Bootstrap-written flags (pre-set by main.cpp before game code runs)
# ------------------------------------------------------------------------

[[entries]]
address = "0x00442FB8"
width   = 4
name    = "vif1_gate_flag"
desc    = "Must be 1 for vif1_buildPacket (0x257080) to proceed. Zero in BSS; bootstrap writes 1 at startup. On real PS2 this is set by IOP module init."
tags    = ["gs_state", "vif"]

[[entries]]
address = "0x00443DC8"
width   = 4
name    = "gs_gate_flag"
desc    = "Gate in gs_initState (0x251B10): $a0 = sltiu(value, 1). If value >= 1, $a0=0 → gate passes → gs_dispatchHelper called. Bootstrap writes 1. On real PS2, set by GS subsystem init after IOP ready."
tags    = ["gs_state"]

[[entries]]
address = "0x00442F70"
width   = 4
name    = "vif1_state_ptr"
desc    = "Pointer dereferenced by vif1_buildPacket (0x257080) gate: READ32(READ32(442F70) + 0x44). If result is 0, packet builder exits early. Null in BSS; requires IOP init to populate."
tags    = ["gs_state", "vif"]

[[entries]]
address = "0x00443870"
name    = "gs_state_ptr"
width   = 4
desc    = "Pointer to the GS state structure (framebuffer descriptors, display buffer array, video mode). Allocated by entry_13fda0_0x140230 (GS state allocator). 66 readers across the GS subsystem. Bootstrap pre-allocates at 0x44C800."
tags    = ["gs_state"]

[[entries]]
address = "0x0044C800"
width   = 0x200
name    = "gs_state_struct"
desc    = "Pre-allocated GS state structure (bootstrap). +0x80: video mode (2 = NTSC interlaced). +0x144: display buffer descriptor array ptr. +0x148: current buffer index. Real game populates this via entry_13fda0_0x140230."
tags    = ["gs_state"]

